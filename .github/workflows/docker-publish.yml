name: Publish Chinese Docker release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*-cn.[0-9]*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: invoker-karl/mikrodash-cn

jobs:
  publish-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Reject anything except an exact Chinese release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-cn\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          [[ "$(node -p "require('./package.json').version")" == "$version" ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable version image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-and-promote:
    needs: publish-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both release platforms
        env:
          VERSION: ${{ needs.publish-version.outputs.version }}
          DIGEST: ${{ needs.publish-version.outputs.digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools inspect "$image@$DIGEST" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux" and .architecture == "amd64")] | length == 1' manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux" and .architecture == "arm64")] | length == 1' manifest.json
          for arch in amd64 arm64; do
            name="verify-$arch"
            docker run --platform "linux/$arch" --detach --name "$name" \
              -e DATA_SECRET=release-verification -p 127.0.0.1::3081 \
              "$image@$DIGEST"
            port="$(docker port "$name" 3081/tcp | sed 's/.*://')"
            ok=false
            for attempt in $(seq 1 30); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/healthz" || true)"
              if [[ "$code" == 200 || "$code" == 503 ]]; then ok=true; break; fi
              sleep 2
            done
            if [[ "$ok" != true ]]; then docker logs "$name"; docker rm -f "$name"; exit 1; fi
            docker rm -f "$name"
          done
          docker buildx imagetools create --tag "$image:latest" "$image@$DIGEST"
          latest_digest="$(docker buildx imagetools inspect "$image:latest" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$latest_digest" == "$DIGEST" ]]

  create-release:
    needs: [publish-version, verify-and-promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release after image verification and promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-version.outputs.version }}
        run: |
          set -euo pipefail
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release_notes.md
          test -s release_notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release_notes.md
