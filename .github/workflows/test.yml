name: Tests

# Runs the suite on every PR and on pushes to main. Tests execute inside a
# built image rather than on a bare runner, so a PR that breaks the Dockerfile,
# the node-routeros patch step or a native build fails here too.
# test/ and .github/ are excluded from every image, so the test sources and the
# release-workflow fixture they audit are mounted read-only at run time.
#
# TWO images are built, and the distinction matters. The suite runs in the
# `test` stage, which is the runtime image plus devDependencies: the runtime
# install is --omit=dev, so a test needing a dev-only tool (espree to parse
# app.js) does not fail there, it fails to LOAD and takes its whole file with
# it — a suite quietly reporting fewer tests than it has. The smoke test needs
# the real runtime image, since that is the artefact users run. They share the
# `base` layer, so building both costs almost nothing.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node patch-routeros.js
      - run: npm run lint
      - run: npm run i18n:audit
      - run: npm test

  test:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # amd64 only — this job verifies behaviour, not multi-arch packaging.
      # docker-publish.yml covers arm64 on tagged releases.
      - name: Build images
        run: |
          docker build --target test -t mikrodash:ci-test .
          docker build -t mikrodash:ci .

      # $PWD is the checkout dir; avoids interpolating a ${{ }} expression
      # into a shell command, which is the workflow-injection footgun.
      # No --entrypoint override: the test stage's own CMD carries the quoted
      # glob (Node 24's runner treats a bare directory as a module to load and
      # dies with MODULE_NOT_FOUND), so running the default exercises the same
      # command the Dockerfile documents.
      - name: Run test suite
        run: |
          docker run --rm \
            -v "$PWD/test:/app/test:ro" \
            -v "$PWD/.github:/app/.github:ro" \
            mikrodash:ci-test

      # Catches startup-only failures the suite cannot see: src/index.js is not
      # covered by any test, so a bad config value or a dependency behaviour
      # change (e.g. body-parser's limit validation) would otherwise reach main.
      # 503 with {"starting":true} is a pass here — no router is configured, so
      # the app never reaches ready; we only assert that it serves HTTP.
      - name: Smoke-test startup
        run: |
          cid=$(docker run -d --rm --tmpfs /data -p 3099:3081 \
            -e DATA_SECRET=ci-smoke-test mikrodash:ci)
          for i in $(seq 1 20); do
            body=$(mktemp)
            code=$(curl -s -o "$body" -w '%{http_code}' http://127.0.0.1:3099/healthz || true)
            if { [ "$code" = "200" ] && jq -e '.ok == true' "$body" >/dev/null; } || \
               { [ "$code" = "503" ] && jq -e '.ok == false and .starting == true' "$body" >/dev/null; }; then
              echo "Server responded with HTTP $code."
              rm -f "$body"
              docker logs "$cid"
              docker stop "$cid" > /dev/null
              exit 0
            fi
            rm -f "$body"
            sleep 2
          done
          echo "Server did not respond within 40s:"
          docker logs "$cid"
          docker stop "$cid" > /dev/null
          exit 1
